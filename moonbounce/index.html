<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b6b2a6" media="(max-width:520px)">
<title>Moon Bounce — Nick Blake</title>
<meta name="description" content="Moon Bounce: an Earth-Moon-Earth delay you can play in the browser.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: a 1980s space-radio computer. One gray hardware plate holds a near-square CRT monitor (cream pixels on slate), a flat PING MOON plate and four small knobs; transport and notes sit below on near-black. Single committed dark look. */
:root{
  color-scheme:dark;
  --font-px:"Silkscreen","Courier New",ui-monospace,monospace;
  --font-term:"VT323",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#0e0f11; --fg:#e9e3d0; --muted:#9a9686; --line:#2b2d31; --panel:#15171a;
  --cream:#ece6d2; --ink:#1c1d1f;
  --plate:#9d998e; --plate-hi:#b6b2a6; --plate-lo:#7a776d;
  --key-top:#d9d5c8; --key-bot:#b9b5a8; --key-edge:#4d4b45;
  --scr:#1a1e25; --scr-dim:#3c424d; --cream-shade:#b4af9d;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font:20px/1.3 var(--font-term);
  padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button{font:inherit}
.page{max-width:560px;margin:0 auto;display:grid;gap:24px}

/* hardware plate */
.unit{
  padding:14px 16px 22px;border-radius:12px;color:var(--ink);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--plate-hi),var(--plate) 30%,var(--plate-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.2),0 14px 34px rgba(0,0,0,.55);
  -webkit-user-select:none;user-select:none;
}
.strip{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-bottom:12px}
.brand{font:700 10px/1.2 var(--font-px);letter-spacing:.14em;text-transform:uppercase}
.stripctl{display:flex;align-items:center;gap:8px} /* echo controls: the Original/Moon switch and Clear */
@media (max-width:560px){.stripctl{width:100%;justify-content:space-between}} /* phones: the mode pair on the left, Clear on the right edge */
/* hardware keys, same treatment as Ping Moon: raised and shaded, pressed in when selected or tapped */
.seg{display:flex;gap:6px}
.seg button{min-height:40px;padding:0 12px;border:1px solid var(--key-edge);border-radius:3px;color:var(--ink);cursor:pointer;font:700 10px/1 var(--font-px);letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--key-top),var(--key-bot));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 0 rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.3)}
.seg button[aria-pressed="true"],#clearBtn:active{background:linear-gradient(180deg,var(--key-bot),var(--key-top));box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.45)} /* pressed: exactly like Ping Moon when pressed */
.seg button:focus-visible,.ping:focus-visible,.knob:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.bezel{padding:10px;border-radius:18px;background:linear-gradient(160deg,var(--plate-lo),var(--plate));
  box-shadow:inset 0 3px 7px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.35),0 1px 0 rgba(255,255,255,.45)}
.lcd{position:relative;border-radius:12px;overflow:hidden;background:var(--scr);box-shadow:inset 0 0 0 1px rgba(0,0,0,.7)}
#lcd{display:block;width:100%;height:auto;image-rendering:crisp-edges;image-rendering:pixelated}
.lcd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.16;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(120% 100% at 50% 40%,transparent 58%,rgba(0,0,0,.42));
  animation:flick 7s steps(1) infinite}
@keyframes flick{0%,88%{opacity:1}89%{opacity:.86}90%{opacity:1}95%{opacity:.93}96%{opacity:1}}
@media (prefers-reduced-motion:reduce){.lcd::after{animation:none}.cur{animation:none}}
.log{position:absolute;left:12px;right:12px;top:12px;z-index:1;padding:7px 10px 6px;border-radius:7px;background:var(--cream);color:var(--ink);font:19px/1.1 var(--font-term);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.log div{white-space:nowrap;overflow:hidden}
.term{position:absolute;inset:0;z-index:1;padding:20px 16px;background:var(--scr);color:var(--cream);font:22px/1.2 var(--font-term);text-shadow:0 0 6px rgba(236,230,210,.25)}
.term div{white-space:nowrap;overflow:hidden}
.term .cur{background:var(--cream)}
.cur{display:inline-block;width:.5em;height:.8em;margin-left:3px;vertical-align:-1px;background:var(--ink);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.ping{display:block;margin:20px auto 0;min-height:46px;padding:0 26px;border:1px solid var(--key-edge);border-radius:3px;cursor:pointer;color:var(--ink);
  font:700 14px/1 var(--font-px);letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--key-top),var(--key-bot));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 0 rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.3)}
.ping:active,.ping.on{background:linear-gradient(180deg,var(--key-bot),var(--key-top));box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.45)}
.ping:disabled{cursor:progress}
/* the player is docked into the device: the device's plate wraps around it */
.unit{border-radius:12px 12px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.player{margin-top:-24px;border:16px solid transparent;border-top-width:0;border-radius:0 0 12px 12px;
  /* the frame is the same brushed metal as the device (stripes + shading), with the dark bay set into it */
  background:linear-gradient(var(--panel),var(--panel)) padding-box,
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px) border-box,
    linear-gradient(180deg,var(--plate-lo),#6f6c63) border-box;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.65),inset 0 -2px 0 rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.5)}
.player + .row{margin-top:14px} /* Export sits outside the device, clear of its shadow */

.knobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
@media (max-width:340px){.knobs{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:20px}}
.kw{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.knob{position:relative;width:clamp(52px,16vw,66px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:ns-resize}
.ticks{position:absolute;left:-14%;top:-14%;width:128%;height:128%;fill:var(--ink);opacity:.65;pointer-events:none}
.cap{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#4b4d50,#1f2123 72%);
  box-shadow:0 4px 7px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.28),0 0 0 2px #121315}
.cap i{position:absolute;left:50%;top:9%;width:3px;height:30%;margin-left:-1.5px;background:var(--cream)}
.kl{font:700 9px/1.25 var(--font-px);letter-spacing:.08em;text-transform:uppercase;text-align:center;overflow-wrap:anywhere}
.kv{min-width:5ch;padding:3px 7px 2px;border-radius:2px;background:var(--scr);color:var(--cream);font:18px/1 var(--font-term);text-align:center}

/* transport + notes */
.panel{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{min-height:44px;padding:0 14px;border:2px solid var(--cream);border-radius:2px;background:transparent;color:var(--cream);cursor:pointer;font:700 11px/1 var(--font-px);letter-spacing:.08em;text-transform:uppercase}
.btn.solid{background:var(--cream);color:var(--ink)}
.btn:hover:not(:disabled){background:var(--fg);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,#seek:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.player{position:relative;display:grid;gap:10px;padding:16px 12px 10px}
.deck{display:grid;grid-template-columns:auto auto 1fr auto auto;grid-template-areas:"play stop seek time loop";align-items:center;gap:10px}
/* the player is part of the device now, so its buttons are hardware keys: the same treatment as Ping Moon */
.tbtn,.loopt,.player .btn,.player .btn.solid{border:1px solid var(--key-edge);border-radius:3px;color:var(--ink);cursor:pointer;
  background:linear-gradient(180deg,var(--key-top),var(--key-bot));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 0 rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.3)}
.player .btn:hover:not(:disabled){background:linear-gradient(180deg,var(--key-top),var(--key-bot));color:var(--ink)}
.tbtn{width:52px;min-height:44px;display:grid;place-items:center;padding:0}
.tbtn svg{width:16px;height:16px;fill:currentColor}
.tbtn .i-play{width:20px;height:20px} /* 10x10 grid at 2px per square, so it matches the stop square's weight */
.tbtn.play{grid-area:play}
.tbtn.stop{grid-area:stop}
/* pressed: exactly like Ping Moon when pressed. Play (while playing) and Loop (while on) stay latched down */
.tbtn:active:not(:disabled),.tbtn.on,.loopt:active,.loopt:has(input:checked),.player .btn:active:not(:disabled){background:linear-gradient(180deg,var(--key-bot),var(--key-top));box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.45)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.tbtn:focus-visible,.player .btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.tbtn .i-pause, .tbtn.on .i-play{display:none}
.tbtn.on .i-pause{display:block}
.deck #seek{grid-area:seek}
.deck .time{grid-area:time}
.loopt{grid-area:loop;position:relative;display:flex;align-items:center;min-height:44px;padding:0 14px;font:700 11px/1 var(--font-px);letter-spacing:.08em;text-transform:uppercase}
.loopt input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.loopt:has(input:focus-visible){outline:2px solid var(--cream);outline-offset:3px}
/* seek bar: a recessed slot with a key-style handle */
.deck #seek{-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer}
.deck #seek::-webkit-slider-runnable-track{height:8px;background:#0c0d0f;border:1px solid #000;border-radius:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
.deck #seek::-moz-range-track{height:8px;background:#0c0d0f;border:1px solid #000;border-radius:2px}
.deck #seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-8px;border:1px solid var(--key-edge);border-radius:2px;background:linear-gradient(180deg,var(--key-top),var(--key-bot));box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.5)}
.deck #seek::-moz-range-thumb{width:14px;height:22px;border:1px solid var(--key-edge);border-radius:2px;background:linear-gradient(180deg,var(--key-top),var(--key-bot))}
.deck #seek:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:520px){
  .deck{grid-template-columns:auto auto 1fr auto;grid-template-areas:"play stop time loop" "seek seek seek seek"}
}
.seekrow{display:flex;align-items:center;gap:12px}
#seek{flex:1;min-width:0;accent-color:var(--cream);height:32px}
.time{font:18px/1 var(--font-term);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.fname:empty{display:none}
.fname,.msg{margin:0;color:var(--muted);overflow-wrap:anywhere}
.msg{min-height:1.3em;color:var(--fg)}

/* ===== phones: the device fills the whole screen, edge to edge; the screen stretches to take up the spare height ===== */
.kl-short{display:none}
@media (max-width:520px){
  body{margin:0;padding:0 0 40px}
  .page{gap:0}
  .unit{border-radius:0;box-shadow:none;display:flex;flex-direction:column;justify-content:space-between;
    padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));
    height:calc(100vh - var(--player-h, 190px));height:calc(100dvh - var(--player-h, 190px));
    min-height:476px} /* exactly one screen tall, but never so short that the screen drops below its minimum (very short phones scroll a little) */
  .fname{line-height:1.1}
  .strip{margin-bottom:6px;flex:none}
  /* the screen shrinks to fit short phones (trimming empty sky off the top) but never grows past its natural shape,
     so the dishes at the sides are never cut off; on tall phones the spare room spreads out between sections */
  .bezel{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px;border-radius:16px}
  /* the screen's height: its natural shape at most (width x 150/160), shrinking on shorter phones down to 220px,
     where the Moon still clears the readout. The scene fills it, trimming empty sky off the top. */
  .lcd{flex:0 1 calc((100vw - 44px)*.9375);min-height:214px;max-height:calc((100vw - 44px)*.9375);border-radius:10px}
  #lcd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
  .log{left:8px;right:8px;top:6px;padding:3px 9px 2px;font-size:15px;line-height:1.05}
  /* Ping Moon gets room to breathe (it's the star of the device): more space around it, extra below, full-size lettering */
  .ping{flex:none;margin-top:18px;min-height:42px;font-size:14px;padding:0 34px}
  .seg button{min-height:34px}
  .player .btn{min-height:34px}
  .tbtn,.loopt{min-height:38px}
  .deck #seek{height:24px}
  .knobs{flex:none;margin-top:24px;gap:8px}
  .kw{gap:4px}
  .kv{padding:2px 6px 1px}
  .knob{width:clamp(46px,12.8vw,50px)}
  .kl-full{display:none}
  .kl-short{display:inline}
  .player{margin-top:0;border-radius:0;border-width:14px;border-top-width:0;padding-top:10px;gap:6px;
    padding-bottom:max(10px,env(safe-area-inset-bottom,0px));box-shadow:inset 0 4px 10px rgba(0,0,0,.65)}
  .player + .row{margin-top:20px;padding:0 16px}
  .player ~ .msg{padding:0 16px}
}
/* ===== desktop: the whole device fits in the window, no scrolling. The song's name sits beside Load/Demo and the
   status message beside Export, so neither adds height; the screen trims a little empty sky off the top; then the
   whole device is scaled down just enough to fit the window (see fitDesktop in the script) ===== */
@media (min-width:521px){
  body{margin:0;padding-block:20px}
  .lcd{height:calc((min(560px,100vw - 32px) - 52px)*.82)}
  #lcd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
  .ping{margin-top:18px}
  .knobs{margin-top:20px}
  .player{grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px}
  .player .deck{grid-column:1 / -1}
  .fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel{grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px}
  .panel .player{grid-column:1 / -1}
  .player ~ .msg{margin:0}
}
</style>
</head>
<body>
<main class="page">
  <h1 class="sr">Moon Bounce</h1>

  <section class="unit" aria-label="Moon Bounce">
    <div class="strip">
      <div class="brand">Earth &middot; Moon &middot; Earth</div>
      <div class="stripctl">
        <div class="seg" role="group" aria-label="Listen to">
          <button id="abOrig" type="button" aria-pressed="false">Original</button>
          <button id="abEcho" type="button" aria-pressed="true">Moon</button>
        </div>
        <div class="seg"><button id="clearBtn" type="button">Clear</button></div>
      </div>
    </div>
    <div class="bezel">
      <div class="lcd">
        <canvas id="lcd" width="160" height="150" role="img" aria-label="Pixel monitor: two radio dishes aim at the Moon above a small horizon"></canvas>
        <div class="log" id="log"></div>
        <div class="term" id="term" hidden></div>
      </div>
    </div>
    <button class="ping" id="ping" type="button">Ping Moon</button>
    <div class="knobs" id="knobs"></div>
  </section>

  <section class="panel" aria-label="Transport">
    <div class="player" aria-label="Player">
      <div class="row">
        <button class="btn solid" id="loadBtn" type="button">Load audio</button>
        <button class="btn" id="demoBtn" type="button">Demo sound</button>
        <input id="file" type="file" accept=".mp3,.m4a,.wav,.aif,.aiff,.aac,.ogg,.flac" hidden>
      </div>
      <p class="fname" id="fname"></p>
      <div class="deck">
        <button class="tbtn play" id="playBtn" type="button" disabled aria-label="Play">
          <svg class="i-play" viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="0.5" width="1" height="1"/><rect x="3" y="1.5" width="1" height="1"/><rect x="4" y="1.5" width="1" height="1"/><rect x="3" y="2.5" width="1" height="1"/><rect x="4" y="2.5" width="1" height="1"/><rect x="5" y="2.5" width="1" height="1"/><rect x="3" y="3.5" width="1" height="1"/><rect x="4" y="3.5" width="1" height="1"/><rect x="5" y="3.5" width="1" height="1"/><rect x="6" y="3.5" width="1" height="1"/><rect x="3" y="4.5" width="1" height="1"/><rect x="4" y="4.5" width="1" height="1"/><rect x="5" y="4.5" width="1" height="1"/><rect x="6" y="4.5" width="1" height="1"/><rect x="7" y="4.5" width="1" height="1"/><rect x="3" y="5.5" width="1" height="1"/><rect x="4" y="5.5" width="1" height="1"/><rect x="5" y="5.5" width="1" height="1"/><rect x="6" y="5.5" width="1" height="1"/><rect x="3" y="6.5" width="1" height="1"/><rect x="4" y="6.5" width="1" height="1"/><rect x="5" y="6.5" width="1" height="1"/><rect x="3" y="7.5" width="1" height="1"/><rect x="4" y="7.5" width="1" height="1"/><rect x="3" y="8.5" width="1" height="1"/></svg>
          <svg class="i-pause" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg>
        </button>

async function typeLine(text){

async function ping(){

/* ---------- knobs ---------- */
const ANG = 135;
const KNOBS = [
  {id:'fb',   label:'Feedback',  def:.25, fmt:pct},
  {id:'dop',  label:'Doppler',   def:.2,  fmt:pct},
  {id:'dust', label:'Moon Dust', short:'Dust', def:.15, fmt:pct},
  {id:'mix',  label:'Mix',       def:.4,  fmt:pct}
];
function knobHTML(k){
  let dots = '';
  for (let i=0;i<11;i++){
    const a = (-ANG + i*(2*ANG/10))*rad;
    dots += '<circle cx="'+(35*Math.sin(a)).toFixed(2)+'" cy="'+(-35*Math.cos(a)).toFixed(2)+'" r="'+(i%5===0?1.9:1.2)+'"/>';
  }
  return '<div class="kw"><div class="knob" id="k-'+k.id+'" role="slider" tabindex="0" aria-labelledby="kl-'+k.id+'" aria-valuemin="0" aria-valuemax="100">'
    + '<svg class="ticks" viewBox="-40 -40 80 80" aria-hidden="true">'+dots+'</svg><div class="cap"><i></i></div></div>'
    + '<div class="kl" id="kl-'+k.id+'">'+(k.short ? '<span class="kl-full">'+k.label+'</span><span class="kl-short" aria-hidden="true">'+k.short+'</span>' : k.label)
    + '</div><div class="kv" id="kv-'+k.id+'"></div></div>';
}
function bindKnob(k){
  const el = $('#k-'+k.id), cap = el.querySelector('.cap'), kv = $('#kv-'+k.id);
  let v = k.def, y0 = 0, v0 = 0;
  function set(nv, silent){
    v = Math.min(1, Math.max(0, nv));
    cap.style.transform = 'rotate('+(-ANG + v*2*ANG).toFixed(1)+'deg)';
    const txt = k.fmt(v);
    kv.textContent = txt;
    el.setAttribute('aria-valuenow', Math.round(v*100));
    el.setAttribute('aria-valuetext', txt);
    state[k.id] = v;
    if (!silent) applyLive();
  }
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = v; el.focus(); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) set(v0 + (y0 - e.clientY)/(e.shiftKey ? 520 : 170)); });
  el.addEventListener('keydown', e => {
    const st = e.shiftKey ? .1 : .02; let nv = null;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') nv = v + st;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') nv = v - st;
    else if (e.key === 'PageUp') nv = v + .1;
    else if (e.key === 'PageDown') nv = v - .1;
    else if (e.key === 'Home') nv = 0;
    else if (e.key === 'End') nv = 1;
    if (nv !== null){ e.preventDefault(); set(nv); }
  });
  el.addEventListener('dblclick', () => set(k.def));
  set(k.def, true);
}
$('#knobs').innerHTML = KNOBS.map(knobHTML).join('');
KNOBS.forEach(bindKnob);

/* ---------- export ---------- */
let pending = null;
function resetExportBtn(){ const b = $('#exportBtn'); if (b) b.textContent = 'Export WAV'; }
const MIME = {wav:'audio/wav', mp3:'audio/mpeg'};
async function saveOut(bytes, ext, what){ // what: e.g. 'your sound once, plus 12.4 s of echo tail'
  const name = 'moon-bounce';
  const inFrame = !!(window.claude && typeof window.claude.use === 'function');
  if (!inFrame){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], {type:MIME[ext]}));
    a.download = name + '.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    msg('Saved ' + name + '.' + ext + (what ? ': ' + what + '.' : '')); return true;
  }
  const dl = await window.claude.use('downloads');
  if (!dl){ msg('Saving files is not available in this view.'); return false; }
  try {
    await dl.save({filename: name + '.zip', data: zipStore(name + '.' + ext, bytes)});
    msg('Saved ' + name + '.zip' + (what ? ' (' + what + ')' : '') + '. Unzip it to get the ' + ext.toUpperCase() + '.'); return true;
  } catch (e){
    msg(e && e.code === 'declined' ? 'Export cancelled.' : 'Could not save the file (' + ((e && e.code) || 'error') + '). Press Save export to try again.');
    return false;
  }
}
async function renderEcho(sr){
  const p = Object.assign({}, state, {echoOn:true});
  const g = p.fb*.88;
  const reps = g < .02 ? 0 : Math.min(12, Math.ceil(Math.log(.003)/Math.log(g)));
  const tail = Math.min(30, p.T*(1+reps) + 1.5);
  const len = Math.ceil((fileBuf.duration + tail)*sr);
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oc = new OC(2, len, sr);
  const n = buildGraph(oc);
  applyTo(n, oc, p, true);
  scheduleDrift(n, 0, len/sr, 20261111);
  const s = oc.createBufferSource(); s.buffer = fileBuf; s.connect(n.input); s.start(0);
  return oc.startRendering();
}
function loadLame(){
  if (window.lamejs) return Promise.resolve();
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = '/moonbounce/lame.min.js'; // lamejs 1.2.1 (LGPL-3.0), served from this site
    el.onload = () => window.lamejs ? res() : rej(new Error('encoder missing'));
    el.onerror = () => rej(new Error('encoder did not load'));
    document.head.appendChild(el);
  });
}
async function encodeMp3(ab){
  await loadLame();
  const enc = new lamejs.Mp3Encoder(2, ab.sampleRate, 192), parts = [];
  const conv = c => { const f = ab.getChannelData(Math.min(c, ab.numberOfChannels-1)), o = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++){ const v = Math.max(-1, Math.min(1, f[i])); o[i] = v < 0 ? v*32768 : v*32767; } return o; };
  const L = conv(0), R = conv(1);
  for (let i = 0; i < L.length; i += 1152){
    const b = enc.encodeBuffer(L.subarray(i, i+1152), R.subarray(i, i+1152));
    if (b.length) parts.push(new Uint8Array(b));
  }
  const end = enc.flush(); if (end.length) parts.push(new Uint8Array(end));
  return new Blob(parts, {type:'audio/mpeg'});
}
async function exportAudio(ext){
  const btn = $('#exportBtn'), mbtn = $('#mp3Btn');
  if (pending){
    btn.disabled = true;
    const ok = await saveOut(pending.bytes, pending.ext, pending.what);
    if (ok){ pending = null; resetExportBtn(); }
    btn.disabled = false; ui(); return;
  }
  if (!fileBuf) return;
  btn.disabled = true; mbtn.disabled = true; msg(ext === 'mp3' ? 'Rendering the echo and encoding MP3...' : 'Rendering the echo...');
  try {
    let sr = fileBuf.sampleRate;
    if (ext === 'mp3' && ![32000, 44100, 48000].includes(sr)) sr = 44100;
    const out = await renderEcho(sr);
    const bytes = ext === 'mp3' ? await encodeMp3(out) : encodeWav(out);
    // the file is always one pass of the sound plus its full echo tail, whatever the player is doing
    const what = 'your sound once, plus ' + Math.max(0, out.duration - fileBuf.duration).toFixed(1) + ' s of echo tail';
    const ok = await saveOut(bytes, ext, what);
    if (!ok){ pending = {bytes, ext, what}; btn.textContent = 'Save export'; }
  } catch (e){
    msg('Export failed: ' + (e && e.message ? e.message : 'unknown error'));
  }
  btn.disabled = false; ui();
}

/* ---------- monitor scene ---------- */
const cv = $('#lcd'), W = 160, H = 150;
const cs = getComputedStyle(document.documentElement);
const BG = cs.getPropertyValue('--scr').trim() || '#1a1e25';
const INK = cs.getPropertyValue('--cream').trim() || '#ece6d2';
const DIM = cs.getPropertyValue('--scr-dim').trim() || '#3c424d';
const SHADE = cs.getPropertyValue('--cream-shade').trim() || '#b4af9d';
let g = cv.getContext('2d');
const MOON = {x:34, y:80, r:13}; // y moves down on short phone screens so the Moon stays clear of the readout (see placeMoon)
const GROUND = 134;
const STN = [{bx:10, px:17, py:121}, {bx:128, px:135, py:121}];
const rand = rng(11);
const stars = [];
for (let guard = 0; stars.length < 30 && guard < 800; guard++){
  const x = 1 + Math.floor(rand()*158), y = 56 + Math.floor(rand()*52);
  if (Math.hypot(x-MOON.x, y-MOON.y) < MOON.r + 8) continue;
  if (y > 96 && (Math.abs(x-17) < 14 || Math.abs(x-135) < 14)) continue;
  if (stars.some(s => Math.abs(s.x-x) < 6 && Math.abs(s.y-y) < 6)) continue;
  stars.push({x, y, p:500 + rand()*1400, o:rand()*4, big:rand() < .5});
}
const sparkles = [[112,68,3],[88,98,2]];
const grass = []; for (let x=0;x<W;x++) grass.push(rand() < .32 ? (rand() < .4 ? 2 : 1) : 0);

function rect(x,y,w,h,c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function dot(x,y,c){ rect(x,y,1,1,c); }
function sparkle(x,y,len,c){ dot(x,y,c); for (let i=1;i<=len;i++){ dot(x+i,y,c); dot(x-i,y,c); dot(x,y+i,c); dot(x,y-i,c); } }
function rot(x,y,a){ const s = Math.sin(a), c = Math.cos(a); return [x*c - y*s, x*s + y*c]; }
function ease(x){ x = Math.min(1, Math.max(0, x)); return x*x*(3-2*x); }
const mix1 = (a,b,q) => a + (b-a)*q;

function drawMoon(){
  const r = MOON.r + 2;
  for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){
    if (Math.hypot(dx, dy) <= MOON.r + .4) dot(MOON.x+dx, MOON.y+dy, INK);
  }
  [[-5,-4,2.4],[3,1,1.7],[-2,6,1.5],[6,-5,1.1],[-7,3,1.1]].forEach(c => {
    for (let dy=-3; dy<=3; dy++) for (let dx=-3; dx<=3; dx++) if (Math.hypot(dx,dy) <= c[2]) dot(MOON.x+c[0]+dx, MOON.y+c[1]+dy, SHADE);
  });
}
const base = document.createElement('canvas'); base.width = W; base.height = H;
function buildBase(){
  const main = g; g = base.getContext('2d');
  rect(0,0,W,H,BG);
  drawMoon();
  rect(0,GROUND,W,1,INK);
  for (let x=0;x<W;x++) for (let i=1;i<=grass[x];i++) dot(x, GROUND-i, INK);
  [5,28,52,76,100,122,152].forEach((x,i) => { const h = 4 + (i%3); rect(x, GROUND-h, 1, h, INK); dot(x-1, GROUND-h+1, INK); dot(x+1, GROUND-h+2, INK); });
  for (let y=GROUND+2;y<H;y++) for (let x=(y&1);x<W;x+=2) dot(x,y,DIM);
  g = main;
}
function station(s, a){
  rect(s.bx, 124, 14, 1, INK); rect(s.bx, 133, 14, 1, INK); rect(s.bx, 124, 1, 10, INK); rect(s.bx+13, 124, 1, 10, INK);
  rect(s.bx+3, 126, 3, 2, INK); rect(s.bx+8, 126, 3, 2, INK); rect(s.bx, 129, 14, 1, INK);
  rect(s.px-1, s.py+2, 2, 3, INK);
  const put = (x,y) => { const r = rot(x,y,a); dot(s.px + r[0], s.py + r[1], INK); };
  for (let u=-7; u<=7; u+=.3){ const yb = -4 + 4*Math.sqrt(Math.max(0, 1-(u/7)*(u/7))); put(u,yb); }
  for (let u=-7; u<=7; u+=.5) put(u,-4);
  for (let y=-5; y>=-9; y--) put(0,y);
  put(-1,-9); put(1,-9);
  const t = rot(0,-10,a);
  return {x:s.px + t[0], y:s.py + t[1]};
}
function lerpP(a,b,q){ return {x:a.x+(b.x-a.x)*q, y:a.y+(b.y-a.y)*q}; }
function surf(from){
  const dx = from.x-MOON.x, dy = from.y-MOON.y, l = Math.hypot(dx,dy) || 1;
  return {x:MOON.x + dx/l*(MOON.r+2), y:MOON.y + dy/l*(MOON.r+2)};
}
function leg(a, b, q){
  for (let k=0; k<=q; k+=.045){ const p = lerpP(a,b,k); dot(p.x,p.y,DIM); }
  [0,.05,.1].forEach((d,i) => {
    const qq = q - d; if (qq < 0) return;
    const p = lerpP(a,b,qq);
    if (i === 0) rect(p.x-1, p.y-1, 3, 3, INK); else rect(p.x, p.y, 2, 2, INK);
  });
}
let tx = null;
const meterBuf = new Float32Array(512); let echoLvl = 0;
let shoot = null, nextShoot = performance.now() + 2500;
let echoT0 = 0, echoAim = 0;
function transmit(){ tx = {t0:performance.now(), dur:state.T*1000}; echoT0 = tx.t0; }
function draw(now){
  g.drawImage(base, 0, 0);
  const nearMoon = (x, y, pad) => Math.hypot(x-MOON.x, y-MOON.y) < MOON.r + pad;
  stars.forEach(s => { if (nearMoon(s.x, s.y, 4)) return; if (reduced || (Math.floor(now/s.p + s.o) % 4) !== 0){ if (s.big) rect(s.x, s.y, 2, 2, INK); else dot(s.x, s.y, INK); } });
  sparkles.forEach(s => { if (!nearMoon(s[0], s[1], s[2] + 3)) sparkle(s[0], s[1], s[2], INK); });
  if (!reduced){
    if (!shoot && now > nextShoot) shoot = {t0:now, x:100 + Math.random()*50, y:58 + Math.random()*18};
    if (shoot){
      const q = (now - shoot.t0)/700;
      if (q >= 1){ shoot = null; nextShoot = now + 5000 + Math.random()*8000; }
      else for (let i=0; i<8; i++){
        const qq = q - i*.03; if (qq < 0) break;
        const px = shoot.x - 40*qq, py = shoot.y + 18*qq;
        if (i === 0) rect(px, py, 2, 2, INK); else dot(px, py, i < 4 ? INK : DIM);
      }
    }
  }
  let el = -1;
  if (tx){ el = Math.max(0, now - tx.t0); if (el > tx.dur + 900){ tx = null; el = -1; } }
  if (nodes && nodes.meter){
    nodes.meter.getFloatTimeDomainData(meterBuf);
    let sum = 0; for (const x of meterBuf) sum += x*x;
    echoLvl = Math.max(Math.sqrt(sum/meterBuf.length), echoLvl*.85);
  } else echoLvl = 0;
  const echoing = state.echoOn && echoLvl > .003; // animation is for your music's echo only (not Ping, not Original mode)
  echoAim += ((echoing ? 1 : 0) - echoAim) * .15; // dishes stay pointed at the Moon while the echo is audible
  const f = Math.max(tx ? ease(el/300) * (1 - ease((el - tx.dur - 500)/400)) : 0, ease(echoAim));
  const sway = reduced ? 0 : .035*Math.sin(now/2300);
  const tipL = station(STN[0], mix1(0, .45, f) + sway);
  const tipR = station(STN[1], mix1(-.3, -.8, f) - sway);
  // echo beams: while the echo is audible, the path dish -> Moon -> dish stays lit and a pulse makes each round trip,
  // timed to the real Earth-Moon delay, so each echo you hear lands as a pulse reaches the right-hand dish
  if (echoing && !tx){
    const k = Math.min(1, echoLvl*8), c = k > .35 ? INK : DIM, gap = .06 + (1-k)*.12;
    const b1 = surf(tipL), a2 = surf(tipR);
    for (let q=0; q<=1; q+=gap){ const p1 = lerpP(tipL,b1,q), p2 = lerpP(a2,tipR,q); dot(p1.x,p1.y,DIM); dot(p2.x,p2.y,DIM); }
    const ph = reduced ? .25 : (((now - echoT0) / (state.T*1000)) % 1 + 1) % 1;
    const p = ph < .5 ? lerpP(tipL, b1, ph*2) : lerpP(a2, tipR, (ph-.5)*2);
    rect(p.x-1, p.y-1, k > .35 ? 3 : 2, k > .35 ? 3 : 2, c);
  }
  if (!tx) return;
  const half = tx.dur/2, dur = tx.dur;
  const b1 = surf(tipL), a2 = surf(tipR);
  if (el < half) leg(tipL, b1, el/half);
  else { leg(tipL, b1, 1); leg(a2, tipR, Math.min(1, (el-half)/half)); }
  if (el < 250) sparkle(Math.round(tipL.x), Math.round(tipL.y), el < 120 ? 4 : 2, INK);
  if (el > half-60 && el < half+280){
    for (let a=0; a<6.28; a+=.14) dot(MOON.x + Math.cos(a)*(MOON.r+4), MOON.y + Math.sin(a)*(MOON.r+4), INK);
  }
  if (el >= dur && el < dur+500) sparkle(Math.round(tipR.x), Math.round(tipR.y), 6 - Math.floor((el-dur)/100), INK);
}
let last = 0;

function setAB(echo){

/* ---------- remember the last uploaded sound (stored only in this browser, with IndexedDB) ---------- */
const saved = (() => {
  const open = () => new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no storage'));
    const r = indexedDB.open('moonbounce', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('sounds');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const tx = db.transaction('sounds', mode), req = fn(tx.objectStore('sounds'));
    tx.oncomplete = () => { db.close(); res(req && req.result); }; tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
  }));
  return {
    put: v => run('readwrite', st => st.put(v, 'last')),
    get: () => run('readonly', st => st.get('last')),
    clear: () => run('readwrite', st => st.delete('last')),
  };
})();
(async () => {
  let last = null;
  try { last = await saved.get(); } catch (e) { return; }
  if (!last || !last.bytes || fileBuf) return;
  try {
    if (!ensureAudio()) return;
    setFile(await ctx.decodeAudioData(last.bytes.slice(0)), last.name);
    msg('Restored your last sound. Press play to hear it.');
  } catch (e) { try { await saved.clear(); } catch (_) {} }
})();

  catch (err){ msg('That file could not be decoded. Try WAV, MP3 or M4A. AIFF only works in some browsers.'); return; }
  // keep a copy in this browser so it's still here after a refresh (never uploaded anywhere)

// On short phone screens the top of the scene is trimmed and the readout sits lower in the scene,

function placeMoon(){
  const r = cv.getBoundingClientRect(), lg = document.getElementById('log').getBoundingClientRect();
  let y = 80;
  if (r.width && r.height){
    const scale = r.width / W, shownTop = Math.max(0, H - r.height/scale);   // canvas rows hidden off the top
    const logBottom = shownTop + (lg.bottom - r.top)/scale;                    // readout's lower edge, in canvas rows
    y = Math.round(Math.min(96, Math.max(80, logBottom + MOON.r + 4)));
  }
  if (y !== MOON.y){ MOON.y = y; buildBase(); }
}
buildBase();
placeMoon();
if ('ResizeObserver' in window){ const ro = new ResizeObserver(placeMoon); ro.observe(cv); ro.observe(document.getElementById('log')); } else addEventListener('resize', placeMoon);
if (document.fonts) document.fonts.ready.then(placeMoon);
draw(performance.now());
requestAnimationFrame(frame);
setInterval(() => { ui(); topUpDrift(); }, 250);
})();

// phones: the device fills the screen exactly. The top part gets (screen height - player height);
// its screen stretches to use whatever's left. Re-measured when the player's height changes.
(() => {
  const pl = document.querySelector('.player'); if (!pl) return;
  const setH = () => document.documentElement.style.setProperty('--player-h', pl.offsetHeight + 'px');
  setH();
  if ('ResizeObserver' in window) new ResizeObserver(setH).observe(pl); else addEventListener('resize', setH);
})();
// desktop: scale the whole device down just enough to fit the window, so nothing scrolls (never below 60%)
(() => {
  const page = document.querySelector('.page'), mq = matchMedia('(min-width:521px)');
  const fit = () => {
    page.style.zoom = '';
    if (!mq.matches) return;
    const z = Math.max(.6, Math.min(1, (innerHeight - 40) / page.getBoundingClientRect().height));
    if (z < 1) page.style.zoom = z.toFixed(3);
  };
  fit();
  addEventListener('resize', fit);
  if (document.fonts) document.fonts.ready.then(fit);
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(document.querySelector('.panel'));
})();
</script>
